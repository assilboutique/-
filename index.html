<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>صندوق كنوز أصيل - منتجات طبيعية فاخرة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Tahoma', 'Noto Sans Arabic', sans-serif;
    background: #f5ede2;  /* Fond crème unifié - PAS DE BLANC */
    color: #2C1810;
    direction: rtl;
    min-height: 100vh;
  }

  /* ───── HEADER + PRODUITS TOTALEMENT FIXES ───── */
  .fixed-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: #f5ede2;  /* Même fond que le body */
    padding: 12px 20px 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  /* ───── SECTION PRODUITS FIXE (juste sous l'offre) ───── */
  .products-fixed-section {
    position: fixed;
    top: 240px;  /* Ajusté pour être juste sous le header */
    left: 0;
    right: 0;
    z-index: 999;
    background: #f5ede2;
    padding: 0 20px;
    max-height: calc(100vh - 240px);
    overflow-y: auto;
  }

  /* Ajustement pour mobile */
  @media (max-width: 600px) {
    .fixed-header { padding: 10px 12px 0; }
    .products-fixed-section {
      top: 210px;
      padding: 0 12px;
      max-height: calc(100vh - 210px);
    }
  }

  @media (max-width: 380px) {
    .products-fixed-section {
      top: 230px;
      max-height: calc(100vh - 230px);
    }
  }

  /* ───── OFFER BANNER (fond sans blanc) ───── */
  .offer-banner {
    background: linear-gradient(135deg, #1E3A2F 0%, #2C4A3A 100%);
    border-radius: 24px;
    padding: 14px 18px;
    position: relative;
    overflow: hidden;
    border: 1px solid #F0CF8E;
  }
  .offer-banner::before {
    content: "🎁";
    font-size: 110px;
    position: absolute;
    bottom: -20px;
    left: -15px;
    opacity: 0.10;
    pointer-events: none;
  }
  .offer-badge {
    background: #D4AF37;
    display: inline-block;
    padding: 3px 12px;
    border-radius: 50px;
    font-weight: bold;
    color: #1E3A2F;
    font-size: 13px;
  }
  .offer-title {
    font-size: 22px;
    font-weight: 800;
    color: #FAD974;
    margin: 6px 0 4px;
  }
  .offer-products {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 8px 0;
  }
  .offer-item {
    background: rgba(255,249,239,0.95);
    border-radius: 60px;
    padding: 4px 14px;
    font-size: 13px;
    font-weight: bold;
    color: #854F0B;
  }
  .offer-bottom {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .price-block {
    background: #2C1810;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 60px;
    direction: ltr;
  }
  .new-price {
    font-size: 26px;
    font-weight: bold;
    color: #FAD974;
    direction: ltr;
    unicode-bidi: embed;
  }
  .btn-order-offer {
    background: #FAD974;
    border: none;
    padding: 9px 24px;
    border-radius: 60px;
    font-weight: bold;
    font-size: 16px;
    color: #1E3A2F;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    transition: 0.2s;
  }
  .btn-order-offer:hover {
    background: #FFE19C;
    transform: scale(1.02);
    box-shadow: 0 5px 12px rgba(0,0,0,0.2);
  }

  /* ───── BARRE DE RECHERCHE (fond transparent/crème) ───── */
  .smart-controls {
    background: transparent;
    border-radius: 0 0 20px 20px;
    padding: 10px 0 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  .search-group { flex: 1; min-width: 180px; }
  .search-group input {
    padding: 11px 18px;
    border-radius: 40px;
    border: 1px solid #E8D5BC;
    font-family: inherit;
    background: #FFFCF8;
    font-size: 15px;
    width: 100%;
  }
  .search-group input:focus {
    outline: none;
    border-color: #EF9F27;
    box-shadow: 0 0 0 2px rgba(239,159,39,0.2);
  }
  .stats {
    font-size: 13px;
    background: #E8DCCE;
    padding: 8px 14px;
    border-radius: 30px;
    white-space: nowrap;
  }

  /* ───── GRILLE PRODUITS ───── */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 20px;
    margin-top: 10px;
    padding-bottom: 20px;
  }
  .product-card {
    background: rgba(255, 255, 255, 0.92);  /* légèrement transparent pour fond crème */
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    transition: 0.2s;
    cursor: pointer;
    border: 1px solid #F0E0CC;
  }
  .product-card:hover {
    transform: translateY(-5px);
    border-color: #EF9F27;
    box-shadow: 0 12px 20px rgba(0,0,0,0.1);
    background: white;
  }
  .product-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    background: #E8DCCC;
  }
  .product-info { padding: 10px; }
  .product-name { font-weight: 800; font-size: 13px; color: #2C1810; }
  .product-region { font-size: 10px; color: #A48C70; margin: 4px 0; }
  .product-price {
    font-weight: bold;
    color: #854F0B;
    font-size: 14px;
    direction: ltr;
    text-align: right;
  }
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 50px;
    font-size: 18px;
    color: #A48C70;
    background: rgba(255,249,239,0.9);
    border-radius: 28px;
  }

  /* ───── MODAL (fond sans blanc) ───── */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1100;
    visibility: hidden;
    opacity: 0;
    transition: 0.2s;
    padding: 20px;
  }
  .modal-overlay.active { visibility: visible; opacity: 1; }
  .modal-container {
    background: #FFFBF4;
    max-width: 360px;
    width: 100%;
    border-radius: 32px;
    padding: 22px;
    position: relative;
    text-align: center;
    border: 1px solid #F7DBA2;
  }
  .close-modal {
    position: absolute;
    left: 18px; top: 12px;
    font-size: 26px;
    cursor: pointer;
    color: #2C1810;
    font-weight: bold;
  }
  .modal-img {
    width: 100%; height: 180px;
    object-fit: cover;
    border-radius: 24px;
    margin: 10px 0;
    background: #E8DCCC;
  }
  .modal-name { font-size: 22px; font-weight: 800; color: #2C1810; }
  .modal-price {
    font-size: 22px;
    font-weight: bold;
    color: #A6571A;
    margin-top: 8px;
    direction: ltr;
    unicode-bidi: embed;
  }
  .modal-btn {
    display: block;
    background: #2C1810;
    color: #FAD974;
    padding: 12px;
    border-radius: 60px;
    text-decoration: none;
    margin-top: 18px;
    font-weight: bold;
    transition: 0.2s;
  }
  .modal-btn:hover { background: #854F0B; color: white; }

  /* Pas de footer fixe, il reste dans le scroll */
  footer {
    text-align: center;
    margin-top: 10px;
    font-size: 12px;
    color: #C6AD89;
    padding: 15px;
    border-top: 1px solid #EFE3D5;
  }

  /* Scrollbar personnalisée */
  .products-fixed-section::-webkit-scrollbar {
    width: 5px;
  }
  .products-fixed-section::-webkit-scrollbar-track {
    background: #E8DCCC;
    border-radius: 10px;
  }
  .products-fixed-section::-webkit-scrollbar-thumb {
    background: #C6AD89;
    border-radius: 10px;
  }
</style>
</head>
<body>

<!-- ═══ HEADER FIXE (offre + recherche) ═══ -->
<div class="fixed-header">

  <div class="offer-banner">
    <div class="offer-badge">🎁 عرض محدود</div>
    <div class="offer-title">صندوق كنوز أصيل - علبة هدايا فاخرة</div>
    <div class="offer-products">
      <div class="offer-item">🍯 عسل السدر</div>
      <div class="offer-item">🫒 زيت الزيتون البكر</div>
      <div class="offer-item">🌹 ماء ورد</div>
      <div class="offer-item">⚫ زيت الحبة السوداء</div>
    </div>
    <div class="offer-bottom">
      <div class="price-block">
        <span class="new-price">7 500 DA</span>
      </div>
      <a href="https://docs.google.com/forms/d/1tgkxzjKXPPjPPLBuztYfmG5ZYSzBSxII9tzEcsTdnIc/viewform" target="_blank" class="btn-order-offer">
        📦 اطلب الآن ←
      </a>
    </div>
  </div>

  <div class="smart-controls">
    <div class="search-group">
      <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج...">
    </div>
    <div class="stats" id="productStats"></div>
  </div>

</div>

<!-- ═══ SECTION PRODUITS FIXE (scrollable à l'intérieur) ═══ -->
<div class="products-fixed-section">
  <div id="productGrid" class="product-grid"></div>
  <footer>⭐ آراء عملائنا   🌸 مجموعة عطرية أصلية – منتجات طبيعية 100%</footer>
</div>

<!-- ═══ MODAL ═══ -->
<div id="modal" class="modal-overlay">
  <div class="modal-container">
    <span class="close-modal" id="closeModalBtn">✕</span>
    <img id="modalImg" class="modal-img" src="" alt="صورة المنتج">
    <div id="modalName" class="modal-name"></div>
    <div id="modalRegion" style="margin:5px 0; color:#5E4B34;"></div>
    <div id="modalDesc" style="margin:10px 0; font-size:13px; line-height:1.5; color:#3A2A1C;"></div>
    <div id="modalPrice" class="modal-price"></div>
    <a id="modalOrderLink" class="modal-btn" href="#" target="_blank">🛒 اطلب الآن</a>
  </div>
</div>

<script>
  const ORDER_LINK = "https://docs.google.com/forms/d/1tgkxzjKXPPjPPLBuztYfmG5ZYSzBSxII9tzEcsTdnIc/viewform";
  
  const products = [
    { name: "🍯 عسل طبيعي", region: "الجزائر", matiere: "نقي 100%", desc: "عسل طبيعي خالص مجموع يدوياً. غني بالمعادن والفيتامينات. 500 غ.", price: "2000 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🍯+عسل+طبيعي" },
    { name: "🍯 عسل الكاليبتوس", region: "سكيكدة — عنابة", matiere: "نقي 100%", desc: "عسل الكاليبتوس الطبيعي. مفيد للجهاز التنفسي والمناعة. 1 كغ.", price: "2300 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🍯+عسل+الكاليبتوس" },
    { name: "🍋 عسل الليمون", region: "عنابة", matiere: "نقي 100%", desc: "عسل الليمون الطبيعي. طعم منعش وفوائد صحية رائعة. 500 غ.", price: "2100 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🍋+عسل+الليمون" },
    { name: "🌿 عسل السدر", region: "جبال الأوراس", matiere: "نقي 100%", desc: "من أجود أنواع العسل الجزائري. نقي 100% بدون إضافات. 1 كغ.", price: "2500 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🌿+عسل+السدر" },
    { name: "🌰 زيت الأرجان", region: "تندوف", matiere: "مستخلص يدوياً", desc: "زيت الأرجان الطبيعي. مستخلص يدوياً للبشرة والشعر والأظافر. 30 مل.", price: "3500 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🌰+زيت+الأرجان" },
    { name: "🌿 زيت الخروع", region: "الجزائر", matiere: "طبيعي 100%", desc: "زيت الخروع الطبيعي. لتكثيف الشعر وتقوية الأظافر وترطيب البشرة.", price: "1400 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🌿+زيت+الخروع" },
    { name: "🌵 زيت التين الشوكي", region: "ورقلة", matiere: "نباتي وعذري", desc: "زيت التين الشوكي النادر. مضاد للشيخوخة. بدون ملونات ولا مواد حافظة. 30 مل.", price: "4500 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🌵+زيت+التين+الشوكي" },
    { name: "⚫ زيت الحبة السوداء", region: "الجزائر", matiere: "بارد العصر 100%", desc: "زيت الحبة السوداء الطبيعي. شفاء من كل داء. معصور بارداً. 125 مل.", price: "1800 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=⚫+زيت+الحبة+السوداء" },
    { name: "🫒 زيت الزيتون البكر", region: "القبائل الكبرى", matiere: "معصور باردًا", desc: "زيت الزيتون البكر الممتاز. معصور باردًا. غني بالأوميغا وفيتامين E. 500 مل.", price: "1900 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🫒+زيت+الزيتون" },
    { name: "🍚 ماء الأرز", region: "الجزائر", matiere: "طبيعي 100%", desc: "ماء الأرز الطبيعي. مرطّب ومنعش للبشرة. يقوّي الشعر ويمنحه البريق.", price: "1200 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🍚+ماء+الأرز" },
    { name: "🌸 ماء اللافندر", region: "جبال الأوراس", matiere: "مقطّر طبيعي", desc: "ماء اللافندر الطبيعي. مهدئ ومنوّم طبيعي. للوسادة والبشرة والشعر.", price: "1600 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🌸+ماء+اللافندر" },
    { name: "🍊 ماء الزهر", region: "البليدة", matiere: "مقطّر من أزهار طازجة", desc: "ماء زهر البرتقال الطبيعي. للطبخ والعناية بالبشرة. جودة ممتازة. 250 مل.", price: "1000 DA", img: "https://placehold.co/400x300/E8DCCC/854F0B?text=🍊+ماء+الزهر" }
  ];

  let currentSearchTerm = "";

  function getFilteredProducts() {
    if(currentSearchTerm.trim() === "") return [...products];
    const term = currentSearchTerm.toLowerCase();
    return products.filter(p => p.name.toLowerCase().includes(term) || p.desc.toLowerCase().includes(term));
  }

  function renderProductGrid() {
    const filtered = getFilteredProducts();
    const container = document.getElementById("productGrid");
    const statsSpan = document.getElementById("productStats");
    let message = `📦 ${filtered.length} / ${products.length} منتج`;
    if(currentSearchTerm.trim() !== "") message += ` 🔍 ("${currentSearchTerm}")`;
    statsSpan.innerText = message;
    
    if(filtered.length === 0) {
      container.innerHTML = `<div class="no-results">😔 لا توجد منتجات مطابقة<br>✏️ جرب كلمة أخرى</div>`;
      return;
    }
    
    container.innerHTML = filtered.map((p, idx) => {
      const originalIdx = products.findIndex(prod => prod.name === p.name && prod.price === p.price);
      return `<div class="product-card" onclick="openProductModal(${originalIdx})">
        <img class="product-img" src="${p.img}" alt="${p.name}">
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-region">📍 ${p.region}</div>
          <div class="product-price">💰 ${p.price}</div>
        </div>
      </div>`;
    }).join('');
  }

  window.openProductModal = function(idx) {
    const prod = products[idx];
    if(!prod) return;
    document.getElementById("modalImg").src = prod.img;
    document.getElementById("modalName").innerText = prod.name;
    document.getElementById("modalRegion").innerHTML = `📍 ${prod.region} | 🌿 ${prod.matiere || "طبيعي"}`;
    document.getElementById("modalDesc").innerText = prod.desc;
    document.getElementById("modalPrice").innerHTML = `💰 ${prod.price}`;
    document.getElementById("modalOrderLink").href = ORDER_LINK;
    document.getElementById("modal").classList.add("active");
  };

  function closeModal() { 
    document.getElementById("modal").classList.remove("active"); 
  }

  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", (e) => {
    if(e.target === document.getElementById("modal")) closeModal();
  });
  
  document.getElementById("searchInput").addEventListener("input", () => {
    currentSearchTerm = document.getElementById("searchInput").value;
    renderProductGrid();
  });

  renderProductGrid();
</script>
</body>
</html>
