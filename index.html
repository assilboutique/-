<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<title>صندوق كنوز أصيل - منتجات طبيعية فاخرة</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden !important;
    background: transparent !important;
  }

  body {
    font-family: 'Segoe UI', 'Tahoma', 'Noto Sans Arabic', sans-serif;
    color: #2C1810;
    direction: rtl;
    min-height: 100vh;
  }

  .main-wrapper {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: transparent;
  }

  .header-sticky {
    position: -webkit-sticky;
    position: sticky;
    top: 0;
    z-index: 100;
    background: transparent;
    padding: 10px 15px 0;
  }

  .products-wrapper {
    padding: 0 15px 20px;
    width: 100%;
  }

  /* OFFER BANNER */
  .offer-banner {
    background: linear-gradient(135deg, #1E3A2F 0%, #2C4A3A 100%);
    border-radius: 20px;
    padding: 12px 16px;
    position: relative;
    overflow: hidden;
    border: 1px solid #F0CF8E;
    margin-bottom: 8px;
  }
  .offer-banner::before {
    content: "🎁";
    font-size: 80px;
    position: absolute;
    bottom: -15px;
    left: -10px;
    opacity: 0.12;
    pointer-events: none;
  }
  .offer-badge {
    background: #D4AF37;
    display: inline-block;
    padding: 2px 10px;
    border-radius: 50px;
    font-weight: bold;
    color: #1E3A2F;
    font-size: 11px;
  }
  .offer-title {
    font-size: 18px;
    font-weight: 800;
    color: #FAD974;
    margin: 5px 0 3px;
  }
  .offer-products {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0;
  }
  .offer-item {
    background: rgba(255,249,239,0.95);
    border-radius: 50px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: bold;
    color: #854F0B;
  }
  .offer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 5px;
  }
  .price-block {
    background: #2C1810;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 50px;
    direction: ltr;
  }
  .new-price {
    font-size: 20px;
    font-weight: bold;
    color: #FAD974;
  }
  .btn-order-offer {
    background: #FAD974;
    border: none;
    padding: 7px 16px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 13px;
    color: #1E3A2F;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
  }

  /* SEARCH */
  .search-bar {
    background: transparent;
    padding: 8px 0 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }
  .search-input {
    flex: 1;
    min-width: 150px;
  }
  .search-input input {
    padding: 8px 14px;
    border-radius: 40px;
    border: 1px solid #E8D5BC;
    font-family: inherit;
    background: white;
    font-size: 13px;
    width: 100%;
  }
  .stats-count {
    font-size: 11px;
    background: rgba(232, 220, 206, 0.9);
    padding: 5px 10px;
    border-radius: 30px;
    white-space: nowrap;
  }

  /* PRODUCT GRID - RESPONSIVE */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 8px;
    width: 100%;
  }

  @media (min-width: 600px) {
    .product-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }
    .header-sticky {
      padding: 12px 20px 0;
    }
    .products-wrapper {
      padding: 0 20px 20px;
    }
  }

  @media (min-width: 900px) {
    .product-grid {
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
  }

  .product-card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: 0.2s;
    cursor: pointer;
    border: 1px solid #F0E0CC;
  }
  .product-card:active {
    transform: scale(0.98);
  }
  .product-img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    background: #F5EDE2;
    display: block;
  }
  .product-info {
    padding: 8px;
  }
  .product-name {
    font-weight: 800;
    font-size: 12px;
    color: #2C1810;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-region {
    font-size: 9px;
    color: #A48C70;
    margin: 3px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .product-price {
    font-weight: bold;
    color: #854F0B;
    font-size: 12px;
    direction: ltr;
    text-align: right;
  }
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 30px;
    font-size: 14px;
    color: #A48C70;
    background: rgba(255,249,239,0.95);
    border-radius: 16px;
  }

  /* MODAL - CORRIGÉ POUR RESTER CENTRÉ PEU IMPORTE LE SCROLL */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    visibility: hidden;
    opacity: 0;
    transition: visibility 0.2s, opacity 0.2s;
  }
  
  .modal-overlay.active {
    visibility: visible;
    opacity: 1;
  }
  
  .modal-container {
    position: relative;
    background: white;
    max-width: 320px;
    width: 90%;
    border-radius: 28px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    transform: scale(0.95);
    transition: transform 0.2s ease-out;
  }
  
  .modal-overlay.active .modal-container {
    transform: scale(1);
  }
  
  .close-modal {
    position: absolute;
    left: 16px;
    top: 12px;
    font-size: 26px;
    cursor: pointer;
    color: #A48C70;
    font-weight: bold;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.2s;
  }
  
  .close-modal:hover {
    background: rgba(0,0,0,0.05);
    color: #2C1810;
  }
  
  .modal-img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 20px;
    margin: 8px 0 12px;
    background: #F5EDE2;
  }
  
  .modal-name {
    font-size: 20px;
    font-weight: 800;
    color: #2C1810;
    margin-top: 6px;
  }
  
  .modal-price {
    font-size: 22px;
    font-weight: bold;
    color: #D4AF37;
    background: #2C1810;
    display: inline-block;
    padding: 6px 20px;
    border-radius: 40px;
    margin: 12px 0;
    direction: ltr;
  }
  
  .modal-btn {
    display: block;
    background: #1E3A2F;
    color: #FAD974;
    padding: 12px;
    border-radius: 60px;
    text-decoration: none;
    margin-top: 16px;
    font-weight: bold;
    font-size: 15px;
    transition: all 0.2s;
  }
  
  .modal-btn:active {
    transform: scale(0.97);
    background: #0F2B21;
  }

  footer {
    text-align: center;
    margin-top: 20px;
    font-size: 10px;
    color: #C6AD89;
    padding: 10px;
    border-top: 1px solid rgba(239, 227, 213, 0.5);
  }

  .main-wrapper {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Empêcher le scroll du body quand la modale est ouverte */
  body.modal-open {
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="main-wrapper">

  <div class="header-sticky">
    <div class="offer-banner">
      <div class="offer-badge">🎁 عرض محدود</div>
      <div class="offer-title">صندوق كنوز أصيل - علبة هدايا فاخرة</div>
      <div class="offer-products">
        <div class="offer-item">🍯 عسل السدر</div>
        <div class="offer-item">🫒 زيت الزيتون البكر</div>
        <div class="offer-item">🌹 ماء ورد</div>
        <div class="offer-item">⚫ زيت الحبة السوداء</div>
      </div>
      <div class="offer-bottom">
        <div class="price-block">
          <span class="new-price">7 500 DA</span>
        </div>
        <a href="https://docs.google.com/forms/d/1tgkxzjKXPPjPPLBuztYfmG5ZYSzBSxII9tzEcsTdnIc/viewform" target="_blank" rel="noopener" class="btn-order-offer">
          📦 اطلب الآن ←
        </a>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-input">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج...">
      </div>
      <div class="stats-count" id="productStats"></div>
    </div>
  </div>

  <div class="products-wrapper">
    <div id="productGrid" class="product-grid"></div>
    <footer>⭐ آراء عملائنا   🌸 منتجات طبيعية 100%</footer>
  </div>

</div>

<!-- MODALE CORRIGÉE - S'AFFICHE PARFAITEMENT AU CENTRE -->
<div id="modal" class="modal-overlay">
  <div class="modal-container">
    <span class="close-modal" id="closeModalBtn">✕</span>
    <img id="modalImg" class="modal-img" src="" alt="صورة المنتج">
    <div id="modalName" class="modal-name"></div>
    <div id="modalRegion" style="margin:6px 0; color:#5E4B34; font-size:12px; background:#F9F4EC; display:inline-block; padding:3px 12px; border-radius:50px;"></div>
    <div id="modalDesc" style="margin:10px 0; font-size:13px; line-height:1.5; color:#3A2A1C; padding:0 6px;"></div>
    <div id="modalPrice" class="modal-price">💰 0 DA</div>
    <a id="modalOrderLink" class="modal-btn" href="#" target="_blank" rel="noopener">🛒 طلب المنتج الآن</a>
  </div>
</div>

<script>
  const ORDER_LINK = "https://docs.google.com/forms/d/1tgkxzjKXPPjPPLBuztYfmG5ZYSzBSxII9tzEcsTdnIc/viewform";

  const products = [
    { name: "🍯 عسل طبيعي", region: "الجزائر", matiere: "نقي 100%", desc: "عسل طبيعي خالص. غني بالمعادن والفيتامينات. 500 غ.", price: "2000 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/1.jpg" },
    { name: "🍯 عسل الكاليبتوس", region: "سكيكدة", matiere: "نقي 100%", desc: "عسل الكاليبتوس الطبيعي. مفيد للجهاز التنفسي. 1 كغ.", price: "2300 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/2.jpg" },
    { name: "🍋 عسل الليمون", region: "عنابة", matiere: "نقي 100%", desc: "عسل الليمون الطبيعي. طعم منعش. 500 غ.", price: "2100 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/3.jpg" },
    { name: "🌿 عسل السدر", region: "الأوراس", matiere: "نقي 100%", desc: "أجود أنواع العسل الجزائري. 1 كغ.", price: "2500 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/4.jpg" },
    { name: "🌰 زيت الأرجان", region: "تندوف", matiere: "مستخلص يدوياً", desc: "زيت الأرجان الطبيعي. للبشرة والشعر. 30 مل.", price: "3500 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/5.jpg" },
    { name: "🌿 زيت الخروع", region: "الجزائر", matiere: "طبيعي", desc: "زيت الخروع الطبيعي. لتكثيف الشعر.", price: "1400 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/6.jpg" },
    { name: "🌵 زيت التين الشوكي", region: "ورقلة", matiere: "نباتي", desc: "زيت التين الشوكي النادر. مضاد للشيخوخة. 30 مل.", price: "4500 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/7.jpg" },
    { name: "⚫ زيت الحبة السوداء", region: "الجزائر", matiere: "بارد العصر", desc: "زيت الحبة السوداء الطبيعي. 125 مل.", price: "1800 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/8.jpg" },
    { name: "🫒 زيت الزيتون البكر", region: "القبائل", matiere: "معصور باردًا", desc: "زيت الزيتون البكر الممتاز. 500 مل.", price: "1900 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/9.jpg" },
    { name: "🍚 ماء الأرز", region: "الجزائر", matiere: "طبيعي", desc: "ماء الأرز الطبيعي. مرطّب للبشرة.", price: "1200 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/10.jpg" },
    { name: "🌸 ماء اللافندر", region: "الأوراس", matiere: "مقطّر", desc: "ماء اللافندر الطبيعي. مهدئ.", price: "1600 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/11.jpg" },
    { name: "🍊 ماء الزهر", region: "البليدة", matiere: "مقطّر", desc: "ماء زهر البرتقال الطبيعي. 250 مل.", price: "1000 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/12.jpg" }
  ];

  let currentSearchTerm = "";

  function getFilteredProducts() {
    if (currentSearchTerm.trim() === "") return [...products];
    const term = currentSearchTerm.toLowerCase();
    return products.filter(p => p.name.toLowerCase().includes(term) || p.desc.toLowerCase().includes(term));
  }

  function renderProductGrid() {
    const filtered = getFilteredProducts();
    const container = document.getElementById("productGrid");
    const statsSpan = document.getElementById("productStats");
    statsSpan.innerText = `📦 ${filtered.length} / ${products.length} منتج`;
    
    if (filtered.length === 0) {
      container.innerHTML = `<div class="no-results">😔 لا توجد منتجات مطابقة<br>✏️ جرب كلمة أخرى</div>`;
      return;
    }
    
    container.innerHTML = filtered.map((p, idx) => {
      // Trouver l'index original dans la liste complète des produits
      const originalIdx = products.findIndex(prod => prod.name === p.name && prod.price === p.price && prod.region === p.region);
      return `
        <div class="product-card" data-product-index="${originalIdx}">
          <img class="product-img" src="${p.img}" alt="${p.name}" onerror="this.src='https://placehold.co/400x300/F5EDE2/854F0B?text=${encodeURIComponent(p.name.split(' ')[1] || p.name)}'">
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-region">📍 ${p.region}</div>
            <div class="product-price">💰 ${p.price}</div>
          </div>
        </div>
      `;
    }).join('');
    
    // Réattacher les événements après le rendu
    document.querySelectorAll('.product-card').forEach(card => {
      card.addEventListener('click', (e) => {
        // Éviter la propagation si on clique sur un enfant
        if(e.target.closest('.product-card')) {
          const idx = parseInt(card.getAttribute('data-product-index'));
          if(!isNaN(idx)) openProductModal(idx);
        }
      });
    });
  }

  window.openProductModal = function(idx) {
    const prod = products[idx];
    if (!prod) return;
    
    // Mettre à jour le contenu de la modale
    document.getElementById("modalImg").src = prod.img;
    document.getElementById("modalName").innerText = prod.name;
    document.getElementById("modalRegion").innerHTML = `📍 ${prod.region} &nbsp;|&nbsp; 🌿 ${prod.matiere}`;
    document.getElementById("modalDesc").innerText = prod.desc;
    document.getElementById("modalPrice").innerHTML = `💰 ${prod.price}`;
    document.getElementById("modalOrderLink").href = ORDER_LINK;
    
    // Empêcher le scroll du body
    document.body.style.overflow = 'hidden';
    document.body.classList.add('modal-open');
    
    // Afficher la modale
    const modal = document.getElementById("modal");
    modal.classList.add("active");
  };

  function closeModal() {
    const modal = document.getElementById("modal");
    modal.classList.remove("active");
    // Réactiver le scroll
    document.body.style.overflow = '';
    document.body.classList.remove('modal-open');
  }

  // Fermer avec la croix
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  
  // Fermer en cliquant sur l'overlay
  document.getElementById("modal").addEventListener("click", (e) => {
    if (e.target === document.getElementById("modal")) {
      closeModal();
    }
  });
  
  // Fermer avec la touche Échap
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("modal").classList.contains("active")) {
      closeModal();
    }
  });
  
  // Gestion de la recherche
  document.getElementById("searchInput").addEventListener("input", (e) => {
    currentSearchTerm = e.target.value;
    renderProductGrid();
  });

  // Initialisation
  renderProductGrid();
</script>
</body>
</html>
