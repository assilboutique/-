<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>صندوق كنوز أصيل - منتجات طبيعية فاخرة</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', 'Tahoma', 'Noto Sans Arabic', sans-serif;
    background: transparent;
    color: #2C1810;
    padding: 20px;
    direction: rtl;
  }

  /* Banner العرض المميز */
  .offer-banner {
    background: linear-gradient(135deg, #1E3A2F 0%, #2C4A3A 100%);
    border-radius: 32px;
    margin-bottom: 30px;
    padding: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
    border: 1px solid #F0CF8E;
  }
  .offer-banner::before {
    content: "🎁";
    font-size: 140px;
    position: absolute;
    bottom: -20px;
    left: -20px;
    opacity: 0.1;
    pointer-events: none;
  }
  .offer-badge {
    background: #D4AF37;
    display: inline-block;
    padding: 5px 15px;
    border-radius: 50px;
    font-weight: bold;
    color: #1E3A2F;
    font-size: 14px;
  }
  .offer-title {
    font-size: 28px;
    font-weight: 800;
    color: #FAD974;
    margin: 10px 0;
  }
  .offer-products {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin: 15px 0;
  }
  .offer-item {
    background: #FFF9EF;
    border-radius: 60px;
    padding: 6px 18px;
    font-size: 14px;
    font-weight: bold;
    color: #854F0B;
  }
  .price-block {
    background: #2C1810;
    display: inline-block;
    padding: 8px 20px;
    border-radius: 60px;
    margin: 10px 0;
  }
  .old-price {
    font-size: 20px;
    color: #C29A6B;
    text-decoration: line-through;
    margin-left: 12px;
  }
  .new-price {
    font-size: 32px;
    font-weight: bold;
    color: #FAD974;
  }
  .discount {
    background: #E6B422;
    color: #2C1810;
    border-radius: 40px;
    padding: 4px 12px;
    font-weight: bold;
  }
  .btn-order-offer {
    background: #FAD974;
    border: none;
    padding: 10px 30px;
    border-radius: 60px;
    font-weight: bold;
    font-size: 18px;
    color: #1E3A2F;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: 0.2s;
  }
  .btn-order-offer:hover {
    background: #FFE19C;
    transform: scale(1.02);
    box-shadow: 0 5px 12px rgba(0,0,0,0.2);
  }

  /* Contrôles */
  .smart-controls {
    background: rgba(255,255,255,0.85);
    border-radius: 28px;
    padding: 15px 20px;
    margin: 20px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  .search-group {
    flex: 1;
  }
  .search-group input {
    padding: 12px 18px;
    border-radius: 40px;
    border: 1px solid #F0E0CC;
    font-family: inherit;
    background: #FFFCF8;
    font-size: 15px;
    width: 100%;
    max-width: 400px;
  }
  .search-group input:focus {
    outline: none;
    border-color: #EF9F27;
    box-shadow: 0 0 0 2px rgba(239,159,39,0.2);
  }
  .stats {
    font-size: 13px;
    background: #F5EDE2;
    padding: 8px 15px;
    border-radius: 30px;
    white-space: nowrap;
  }

  /* Grille produits */
  .product-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    margin-top: 10px;
    min-height: 200px;
  }
  .product-card {
    width: 170px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(0,0,0,0.05);
    transition: 0.2s;
    cursor: pointer;
    border: 1px solid #F0E0CC;
  }
  .product-card:hover {
    transform: translateY(-5px);
    border-color: #EF9F27;
    box-shadow: 0 12px 20px rgba(0,0,0,0.1);
  }
  .product-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    background: #F5EDE2;
  }
  .product-info {
    padding: 10px;
  }
  .product-name {
    font-weight: 800;
    font-size: 13px;
    color: #2C1810;
  }
  .product-region {
    font-size: 10px;
    color: #A48C70;
    margin: 4px 0;
  }
  .product-price {
    font-weight: bold;
    color: #854F0B;
    font-size: 14px;
  }
  .no-results {
    width: 100%;
    text-align: center;
    padding: 50px;
    font-size: 18px;
    color: #A48C70;
    background: rgba(255,249,239,0.9);
    border-radius: 28px;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    visibility: hidden;
    opacity: 0;
    transition: 0.2s;
  }
  .modal-overlay.active {
    visibility: visible;
    opacity: 1;
  }
  .modal-container {
    background: #FFFBF4;
    max-width: 360px;
    width: 90%;
    border-radius: 32px;
    padding: 22px;
    position: relative;
    text-align: center;
    border: 1px solid #F7DBA2;
  }
  .close-modal {
    position: absolute;
    left: 18px;
    top: 12px;
    font-size: 26px;
    cursor: pointer;
    color: #2C1810;
    font-weight: bold;
  }
  .modal-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 24px;
    margin: 10px 0;
  }
  .modal-name {
    font-size: 22px;
    font-weight: 800;
    color: #2C1810;
  }
  .modal-price {
    font-size: 22px;
    font-weight: bold;
    color: #A6571A;
    margin-top: 8px;
  }
  .modal-btn {
    display: block;
    background: #2C1810;
    color: #FAD974;
    padding: 12px;
    border-radius: 60px;
    text-decoration: none;
    margin-top: 18px;
    font-weight: bold;
    transition: 0.2s;
  }
  .modal-btn:hover {
    background: #854F0B;
    color: white;
  }

  footer {
    text-align: center;
    margin-top: 45px;
    font-size: 12px;
    color: #C6AD89;
    padding: 15px;
    border-top: 1px solid #EFE3D5;
  }

  @media (max-width: 550px) {
    .offer-title { font-size: 22px; }
    .new-price { font-size: 26px; }
    .product-card { width: 155px; }
    .smart-controls { flex-direction: column; align-items: stretch; }
    .stats { text-align: center; }
  }
</style>
</head>
<body>

<!-- بطاقة العرض المحدود الرئيسية -->
<div class="offer-banner">
  <div class="offer-badge">🎁 عرض محدود</div>
  <div class="offer-title">
    صندوق كنوز أصيل - علبة هدايا فاخرة
  </div>
  <div class="offer-products">
    <div class="offer-item">🍯 عسل السدر</div>
    <div class="offer-item">🫒 زيت الزيتون البكر</div>
    <div class="offer-item">🌹 ماء ورد</div>
    <div class="offer-item">⚫ زيت الحبة السوداء</div>
  </div>
  <div class="price-block">
    <span class="old-price">9 500 DA</span>
    <span class="new-price">7 500 DA</span>
    <span class="discount">وفّر 2 000 DA</span>
  </div>
  <div>
    <a href="https://docs.google.com/forms/d/1tgkxzjKXPPjPPLBuztYfmG5ZYSzBSxII9tzEcsTdnIc/viewform" target="_blank" class="btn-order-offer">
      📦 اطلب الآن ←
    </a>
  </div>
</div>

<!-- شريط البحث -->
<div class="smart-controls">
  <div class="search-group">
    <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج... (اكتب تلقائياً)">
  </div>
  <div class="stats" id="productStats"></div>
</div>

<div id="productGrid" class="product-grid"></div>

<footer>⭐ آراء عملائنا   🌸 مجموعة عطرية أصلية – منتجات طبيعية 100%</footer>

<!-- Modal -->
<div id="modal" class="modal-overlay">
  <div class="modal-container">
    <span class="close-modal" id="closeModalBtn">✕</span>
    <img id="modalImg" class="modal-img" src="" alt="صورة المنتج">
    <div id="modalName" class="modal-name"></div>
    <div id="modalRegion" style="margin:5px 0; color:#5E4B34;"></div>
    <div id="modalDesc" style="margin:10px 0; font-size:13px; line-height:1.5; color:#3A2A1C;"></div>
    <div id="modalPrice" class="modal-price"></div>
    <a id="modalOrderLink" class="modal-btn" href="#" target="_blank">🛒 اطلب الآن</a>
  </div>
</div>

<script>
  const ORDER_LINK = "https://docs.google.com/forms/d/1tgkxzjKXPPjPPLBuztYfmG5ZYSzBSxII9tzEcsTdnIc/viewform";

  let products = [];

  const defaultProducts = [
    { name: "عسل طبيعي", region: "الجزائر", matiere: "نقي 100%", desc: "عسل طبيعي خالص مجموع يدوياً. غني بالمعادن والفيتامينات. 500 غ.", price: "2000 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/1.jpg" },
    { name: "عسل الكاليبتوس", region: "سكيكدة — عنابة", matiere: "نقي 100%", desc: "عسل الكاليبتوس الطبيعي. مفيد للجهاز التنفسي والمناعة. 1 كغ.", price: "2300 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/2.jpg" },
    { name: "عسل الليمون", region: "عنابة", matiere: "نقي 100%", desc: "عسل الليمون الطبيعي. طعم منعش وفوائد صحية رائعة. 500 غ.", price: "2100 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/3.jpg" },
    { name: "عسل السدر", region: "جبال الأوراس", matiere: "نقي 100%", desc: "من أجود أنواع العسل الجزائري. نقي 100% بدون إضافات. 1 كغ.", price: "2500 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/4.jpg" },
    { name: "زيت الأرجان", region: "تندوف", matiere: "مستخلص يدوياً", desc: "زيت الأرجان الطبيعي. مستخلص يدوياً للبشرة والشعر والأظافر. 30 مل.", price: "3500 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/5.jpg" },
    { name: "زيت الخروع", region: "الجزائر", matiere: "طبيعي 100%", desc: "زيت الخروع الطبيعي. لتكثيف الشعر وتقوية الأظافر وترطيب البشرة.", price: "1400 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/6.jpg" },
    { name: "زيت التين الشوكي", region: "ورقلة", matiere: "نباتي وعذري", desc: "زيت التين الشوكي النادر. مضاد للشيخوخة. بدون ملونات ولا مواد حافظة. 30 مل.", price: "4500 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/7.jpg" },
    { name: "زيت الحبة السوداء", region: "الجزائر", matiere: "بارد العصر 100%", desc: "زيت الحبة السوداء الطبيعي. شفاء من كل داء. معصور بارداً. 125 مل.", price: "1800 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/8.jpg" },
    { name: "زيت الزيتون البكر", region: "القبائل الكبرى", matiere: "معصور باردًا", desc: "زيت الزيتون البكر الممتاز. معصور باردًا. غني بالأوميغا وفيتامين E. 500 مل.", price: "1900 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/9.jpg" },
    { name: "ماء الأرز", region: "الجزائر", matiere: "طبيعي 100%", desc: "ماء الأرز الطبيعي. مرطّب ومنعش للبشرة. يقوّي الشعر ويمنحه البريق.", price: "1200 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/10.jpg" },
    { name: "ماء اللافندر", region: "جبال الأوراس", matiere: "مقطّر طبيعي", desc: "ماء اللافندر الطبيعي. مهدئ ومنوّم طبيعي. للوسادة والبشرة والشعر.", price: "1600 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/11.jpg" },
    { name: "ماء الزهر", region: "البليدة", matiere: "مقطّر من أزهار طازجة", desc: "ماء زهر البرتقال الطبيعي. للطبخ والعناية بالبشرة. جودة ممتازة. 250 مل.", price: "1000 DA", img: "https://raw.githubusercontent.com/assilboutique/-/main/12.jpg" }
  ];

  function loadData() {
    products = [...defaultProducts];
  }

  let currentSearchTerm = "";

  function getFilteredProducts() {
    let filtered = [...products];
    if(currentSearchTerm.trim() !== "") {
      const term = currentSearchTerm.toLowerCase();
      filtered = filtered.filter(p => p.name.toLowerCase().includes(term) || p.desc.toLowerCase().includes(term));
    }
    return filtered;
  }

  function renderProductGrid() {
    const filtered = getFilteredProducts();
    const container = document.getElementById("productGrid");
    const statsSpan = document.getElementById("productStats");
    
    let message = `📦 ${filtered.length} / ${products.length} منتج`;
    if(currentSearchTerm.trim() !== "") {
      message += ` 🔍 (بحث: "${currentSearchTerm}")`;
    }
    statsSpan.innerText = message;

    if(filtered.length === 0) {
      container.innerHTML = `<div class="no-results">😔 لا توجد منتجات مطابقة لبحثك<br>✏️ جرب كلمة أخرى</div>`;
      return;
    }

    container.innerHTML = filtered.map((p, idx) => {
      const originalIndex = products.findIndex(prod => prod.name === p.name && prod.price === p.price && prod.region === p.region);
      return `
      <div class="product-card" onclick="openProductModal(${originalIndex})">
        <img class="product-img" src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/170x140?text=صورة'">
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-region">📍 ${p.region}</div>
          <div class="product-price">💰 ${p.price}</div>
        </div>
      </div>
    `}).join('');
  }

  function updateSearch() {
    currentSearchTerm = document.getElementById("searchInput").value;
    renderProductGrid();
  }

  window.openProductModal = function(originalIndex) {
    const prod = products[originalIndex];
    if(!prod) return;
    document.getElementById("modalImg").src = prod.img;
    document.getElementById("modalName").innerText = prod.name;
    document.getElementById("modalRegion").innerHTML = `📍 ${prod.region} | 🌿 ${prod.matiere || "طبيعي"}`;
    document.getElementById("modalDesc").innerText = prod.desc;
    document.getElementById("modalPrice").innerHTML = `💰 ${prod.price}`;
    document.getElementById("modalOrderLink").href = ORDER_LINK;
    document.getElementById("modal").classList.add("active");
  };

  function closeModal() {
    document.getElementById("modal").classList.remove("active");
  }

  document.getElementById("closeModalBtn").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("click", (e) => { 
    if(e.target === document.getElementById("modal")) closeModal(); 
  });
  document.getElementById("searchInput").addEventListener("input", updateSearch);

  loadData();
  renderProductGrid();
</script>
</body>
</html>
