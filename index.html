<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
body { font-family: Arial, sans-serif; padding: 15px; background: #FDF8F2; direction: rtl; }
#liste { display: flex; flex-wrap: wrap; gap: 14px; }
.produit { border: 1px solid #F0E8DC; border-radius: 16px; overflow: hidden; background: #fff; width: 165px; cursor: pointer; transition: 0.2s; }
.produit:hover { border-color: #EF9F27; transform: translateY(-2px); }
.produit img { width: 100%; height: 130px; object-fit: cover; }
.info { padding: 10px; }
.nom { font-weight: bold; color: #2C1810; font-size: 12px; margin-bottom: 4px; }
.region { font-size: 11px; color: #888780; margin-bottom: 4px; }
.prix { color: #854F0B; font-weight: bold; font-size: 13px; }
#modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 999; }
#modal-contenu { background: #FDF8F2; border-radius: 16px; padding: 20px; max-width: 340px; width: 90%; position: relative; direction: rtl; }
#modal-contenu img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; }
.m-nom { font-size: 17px; font-weight: bold; color: #2C1810; margin-bottom: 6px; }
.m-info { font-size: 13px; color: #666; margin: 4px 0; }
.m-desc { font-size: 13px; color: #444; margin: 8px 0; line-height: 1.6; }
.m-prix { font-size: 17px; color: #854F0B; font-weight: bold; margin-top: 10px; }
.m-btn { display: block; width: 100%; padding: 10px 0; margin-top: 14px; background: #2C1810; color: #FAC775; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; font-weight: bold; }
.m-btn:hover { background: #854F0B; }
.fermer { position: absolute; top: 10px; left: 14px; font-size: 22px; cursor: pointer; color: #2C1810; font-weight: bold; }
</style>
</head>
<body>

<div id="liste"></div>
<div id="modal" style="display:none">
  <div id="modal-contenu"></div>
</div>

<script>
const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSfp6xNDTfmJww7bnKDr0SNOrCuUCDucVW-aYLJeilW_SsDS6A/viewform?usp=header";

const produits = [
  { nom: "عسل طبيعي", region: "الجزائر", matiere: "نقي ١٠٠٪", desc: "عسل طبيعي خالص مجموع يدوياً. غني بالمعادن والفيتامينات. 500 غ.", prix: "2 000 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/1.jpg" },
  { nom: "عسل الكاليبتوس", region: "سكيكدة — عنابة", matiere: "نقي ١٠٠٪", desc: "عسل الكاليبتوس الطبيعي. مفيد للجهاز التنفسي والمناعة. 1 كغ.", prix: "2 300 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/2.jpg" },
  { nom: "عسل الليمون", region: "عنابة", matiere: "نقي ١٠٠٪", desc: "عسل الليمون الطبيعي. طعم منعش وفوائد صحية رائعة. 500 غ.", prix: "2 100 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/3.jpg" },
  { nom: "عسل السدر", region: "جبال الأوراس", matiere: "نقي ١٠٠٪", desc: "من أجود أنواع العسل الجزائري. نقي ١٠٠٪ بدون إضافات. 1 كغ.", prix: "2 500 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/4.jpg" },
  { nom: "زيت الأرجان", region: "تندوف", matiere: "مستخلص يدوياً", desc: "زيت الأرجان الطبيعي. مستخلص يدوياً للبشرة والشعر والأظافر. 30 مل.", prix: "3 500 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/5.jpg" },
  { nom: "زيت الخروع", region: "الجزائر", matiere: "طبيعي ١٠٠٪", desc: "زيت الخروع الطبيعي. لتكثيف الشعر وتقوية الأظافر وترطيب البشرة.", prix: "1 400 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/6.jpg" },
  { nom: "زيت التين الشوكي", region: "ورقلة", matiere: "نباتي وعذري", desc: "زيت التين الشوكي النادر. مضاد للشيخوخة. بدون ملونات ولا مواد حافظة. 30 مل.", prix: "4 500 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/7.jpg" },
  { nom: "زيت الحبة السوداء", region: "الجزائر", matiere: "بارد العصر ١٠٠٪", desc: "زيت الحبة السوداء الطبيعي. شفاء من كل داء. معصور بارداً. 125 مل.", prix: "1 800 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/8.jpg" },
  { nom: "زيت الزيتون البكر", region: "القبائل الكبرى", matiere: "معصور باردًا", desc: "زيت الزيتون البكر الممتاز. معصور باردًا. غني بالأوميغا وفيتامين E. 500 مل.", prix: "1 900 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/9.jpg" },
  { nom: "ماء الأرز", region: "الجزائر", matiere: "طبيعي ١٠٠٪", desc: "ماء الأرز الطبيعي. مرطّب ومنعش للبشرة. يقوّي الشعر ويمنحه البريق.", prix: "1 200 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/10.jpg" },
  { nom: "ماء اللافندر", region: "جبال الأوراس", matiere: "مقطّر طبيعي", desc: "ماء اللافندر الطبيعي. مهدئ ومنوّم طبيعي. للوسادة والبشرة والشعر.", prix: "1 600 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/11.jpg" },
  { nom: "ماء الزهر", region: "البليدة", matiere: "مقطّر من أزهار طازجة", desc: "ماء زهر البرتقال الطبيعي. للطبخ والعناية بالبشرة. جودة ممتازة. 250 مل.", prix: "1 000 DA", photo: "https://raw.githubusercontent.com/assilboutique/-/main/12.jpg" },
];

document.getElementById("liste").innerHTML = produits.map((p, i) => `
  <div class="produit" onclick="ouvrir(${i})">
    <img src="${p.photo}" alt="${p.nom}" onerror="this.src='https://via.placeholder.com/165x130?text=صورة'">
    <div class="info">
      <div class="nom">${p.nom}</div>
      <div class="region">📍 ${p.region}</div>
      <div class="prix">${p.prix}</div>
    </div>
  </div>
`).join("");

function ouvrir(i) {
  const p = produits[i];
  document.getElementById("modal-contenu").innerHTML = `
    <span class="fermer" onclick="fermer()">✕</span>
    <img src="${p.photo}" alt="${p.nom}">
    <div class="m-nom">${p.nom}</div>
    <div class="m-info">📍 المنطقة : ${p.region}</div>
    <div class="m-info">🌿 المادة : ${p.matiere}</div>
    <div class="m-desc">${p.desc}</div>
    <div class="m-prix">💰 ${p.prix}</div>
    <a class="m-btn" href="${formURL}" target="_blank">🛒 اطلب الآن</a>
  `;
  document.getElementById("modal").style.display = "flex";
}

function fermer() {
  document.getElementById("modal").style.display = "none";
}
</script>
</body>
</html>
